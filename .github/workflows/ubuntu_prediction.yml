name: Frozen model Ubuntu prediction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ubuntu_prediction.yml
      - model_elgin/reproducibility/**
      - model_elgin/context_reference_v1/requirements.txt

permissions:
  contents: read

jobs:
  frozen-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check the unchanged frozen model in Ubuntu 24.04
        run: python3 -B model_elgin/reproducibility/run_ubuntu_check.py --output-dir model_elgin/outputs/github_ubuntu_check
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-prediction-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            model_elgin/outputs/github_ubuntu_check/status.json
            model_elgin/outputs/github_ubuntu_check/complete.json
            model_elgin/outputs/github_ubuntu_check/*.log
            model_elgin/outputs/github_ubuntu_check/results/
